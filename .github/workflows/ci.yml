name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: lint + test ─────────────────────────────────────────────────────
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          pip install --quiet ruff
          ruff check app/ tests/ --select E,F,W,I --ignore E501

      - name: Type check (mypy)
        run: |
          pip install --quiet mypy types-pyaml
          mypy app/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true   # advisory only — does not block merge

      - name: Run tests
        env:
          # JWT validation is skipped when these are empty — safe for CI
          FABRIC_TENANT_ID: ""
          BACKEND_APP_ID: ""
        run: python -m pytest tests/ -v --tb=short

  # ── Frontend: type-check ─────────────────────────────────────────────────────
  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Workload

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Workload/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true   # advisory only — strictNullChecks migration in progress
