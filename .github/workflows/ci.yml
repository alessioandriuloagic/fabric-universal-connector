name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: lint + test ─────────────────────────────────────────────────────
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          pip install --quiet ruff
          ruff check app/ tests/ --select E,F,W,I --ignore E501

      - name: Type check (mypy)
        run: |
          pip install --quiet mypy types-pyaml
          mypy app/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true   # advisory only — does not block merge

      - name: Security scan (bandit)
        run: |
          pip install --quiet bandit
          bandit -r app/ -ll

      - name: Run tests
        env:
          # JWT validation is skipped when these are empty — safe for CI
          FABRIC_TENANT_ID: ""
          BACKEND_APP_ID: ""
        run: python -m pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-fail-under=70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14

  # ── Frontend: type-check + unit tests ───────────────────────────────────────
  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Workload

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Workload/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit (npm)
        run: npm audit --audit-level=high

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true   # advisory only — strictNullChecks migration in progress

      - name: Unit tests with coverage
        run: npm test -- --ci --passWithNoTests --coverage --coverageThreshold='{"global":{"lines":50}}'

  # ── Frontend: multi-workload build matrix ────────────────────────────────────
  frontend-build:
    name: Build ${{ matrix.workload }} (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: Workload

    strategy:
      fail-fast: false
      matrix:
        workload:
          - customer-insight-journey
          - business-central
          - sales-crm
          - sql-db
        environment:
          - prod
        # Add test builds only on main to save CI minutes on feature branches
        include:
          - workload: customer-insight-journey
            environment: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Workload/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.workload }} (${{ matrix.environment }})
        run: npm run build:${{ matrix.workload }}:${{ matrix.environment }}
        env:
          REACT_APP_WORKLOAD_ID: ${{ matrix.workload }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ matrix.workload }}-${{ matrix.environment }}
          path: build/Frontend/
          retention-days: 7

  # ── Backend: Docker build (+ push to GHCR on main) ──────────────────────────
  docker-build:
    name: Docker build backend
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}/fabric-connector-backend:latest
            ghcr.io/${{ github.repository }}/fabric-connector-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
